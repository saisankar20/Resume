name: Archive Old Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  archive-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "Saisankar20"
          git config --global user.email "sankar156b@gmail.com"

      - name: Get the current date
        id: date
        run: |
          echo "month=$(date +'%B')" >> $GITHUB_ENV
          echo "day=$(date +'%d')" >> $GITHUB_ENV

      - name: Archive old resume and process new file
        run: |
          # Archive the existing resume if it exists
          if [ -f resume-SaiSankar.pdf ]; then
            git fetch origin old-resume
            git checkout old-resume || git checkout --orphan old-resume

            # Copy old resume to old-resume branch
            mv ../resume-SaiSankar.pdf "resume-SaiSankar-${{ env.month }}-${{ env.day }}-$(date +'%H%M%S').pdf"
            git add "resume-SaiSankar-${{ env.month }}-${{ env.day }}-$(date +'%H%M%S').pdf"
            git commit -m "Archived previous resume"
            git push origin old-resume

            # Return to main branch
            git checkout main
          else
            echo "No existing resume-SaiSankar.pdf to archive."
          fi

          # Rename new file to resume-SaiSankar.pdf
          for file in $(ls *.pdf | grep -v 'resume-SaiSankar.pdf'); do
            mv "$file" "resume-SaiSankar.pdf"
            git add "resume-SaiSankar.pdf"
            git commit -m "Updated resume with new file: $file"
            git push origin main
          done
