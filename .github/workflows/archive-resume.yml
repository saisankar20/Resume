name: Archive Old Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  archive-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "Saisankar20"
          git config --global user.email "sankar156b@gmail.com"

      - name: Get the current date
        id: date
        run: |
          echo "month=$(date +'%B')" >> $GITHUB_ENV
          echo "day=$(date +'%d')" >> $GITHUB_ENV

      - name: Archive incorrectly named files to 'old-resume' branch
        run: |
          # Checkout or create the 'old-resume' branch
          git fetch origin old-resume
          git checkout old-resume || git checkout --orphan old-resume

          # Move incorrectly named files to 'old-resume' branch
          for file in $(ls | grep -i "resume" | grep -v "resume-SaiSankar.pdf"); do
            NEW_FILENAME="${file%.*}-${{ env.month }}-${{ env.day }}.${file##*.}"
            if [ -f "$NEW_FILENAME" ]; then
              NEW_FILENAME="${file%.*}-${{ env.month }}-${{ env.day }}-$(date +'%H%M%S').${file##*.}"
            fi
            mv "../$file" "$NEW_FILENAME"
            git add "$NEW_FILENAME"
            echo "Archived $file as $NEW_FILENAME"
          done

          # Commit and push changes to 'old-resume' branch
          git commit -m "Archived incorrectly named resumes" || echo "No changes to commit"
          git push origin old-resume || echo "No changes to push on old-resume branch"

      - name: Return to main branch
        run: |
          git checkout main

      - name: Clean up incorrectly named files from main branch
        run: |
          # Remove incorrectly named files from main branch
          for file in $(ls | grep -i "resume" | grep -v "resume-SaiSankar.pdf"); do
            git rm -f "$file"
            echo "Removed $file from main branch"
          done

          # Commit and push changes
          git commit -m "Cleaned up incorrectly named files" || echo "No changes to commit"
          git push origin main || echo "No changes to push on main branch"
