name: Archive Old Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write  # Grants permissions to modify repository content

jobs:
  archive-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history to ensure proper branch handling

      - name: Set up Git
        run: |
          git config --global user.name "Saisankar20"
          git config --global user.email "sankar156b@gmail.com"

      - name: Get the current date
        id: date
        run: |
          echo "month=$(date +'%B')" >> $GITHUB_ENV
          echo "day=$(date +'%d')" >> $GITHUB_ENV

      - name: Archive old resume to 'old-resume' branch
        run: |
          # Checkout or create the 'old-resume' branch
          git fetch origin old-resume
          git checkout old-resume || git checkout --orphan old-resume

          # Rename the existing resume if it exists
          if [ -f resume-SaiSankar.pdf ]; then
            NEW_FILENAME="resume-SaiSankar-${{ env.month }}-${{ env.day }}.pdf"
            if [ -f "$NEW_FILENAME" ]; then
              NEW_FILENAME="resume-SaiSankar-${{ env.month }}-${{ env.day }}-$(date +'%H%M%S').pdf"
            fi
            mv resume-SaiSankar.pdf "$NEW_FILENAME"
            git add "$NEW_FILENAME"
            git commit -m "Archived old resume as $NEW_FILENAME"
          fi

          # Push changes to the 'old-resume' branch
          git push origin old-resume || echo "No changes to push on old-resume branch"

      - name: Return to main branch
        run: |
          git checkout main

      - name: Add and commit the latest resume on main branch
        run: |
          if [ -f resume-SaiSankar.pdf ]; then
            git add resume-SaiSankar.pdf
            git commit -m "Updated resume on main branch" || echo "No changes to commit"
            git push origin main
          else
            echo "No updated resume found on main branch."
