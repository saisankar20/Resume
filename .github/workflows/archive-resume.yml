name: Archive Old Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  archive-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "Saisankar20"
          git config --global user.email "sankar156b@gmail.com"

      - name: Get the current date
        id: date
        run: |
          echo "month=$(date +'%B')" >> $GITHUB_ENV
          echo "day=$(date +'%d')" >> $GITHUB_ENV

      - name: Archive old resume and process new file
        run: |
          # Check if the old resume exists
          if [ -f resume-SaiSankar.pdf ]; then
            git fetch origin old-resume
            git checkout old-resume || git checkout --orphan old-resume

            # Rename and move old resume
            OLD_FILENAME="resume-SaiSankar-${{ env.month }}-${{ env.day }}-$(date +'%H%M%S').pdf"
            mv ../resume-SaiSankar.pdf "$OLD_FILENAME"
            git add "$OLD_FILENAME"
            git commit -m "Archived previous resume as $OLD_FILENAME"
            git push origin old-resume

            # Return to main branch
            git checkout main
          else
            echo "No existing resume-SaiSankar.pdf to archive."
          fi

          # Archive all other PDF files except the new one
          for file in $(ls *.pdf | grep -v 'resume-SaiSankar.pdf'); do
            git fetch origin old-resume
            git checkout old-resume

            ARCHIVE_FILENAME="${file%.*}-${{ env.month }}-${{ env.day }}.pdf"
            mv ../"$file" "$ARCHIVE_FILENAME"
            git add "$ARCHIVE_FILENAME"
            git commit -m "Archived $file as $ARCHIVE_FILENAME"
            git push origin old-resume

            git checkout main
            git rm "$file"
          done

          # Rename the new file to resume-SaiSankar.pdf
          for file in $(ls *.pdf | grep -v 'resume-SaiSankar.pdf'); do
            mv "$file" "resume-SaiSankar.pdf"
            git add "resume-SaiSankar.pdf"
            git commit -m "Updated resume with new file"
            git push origin main
          done
