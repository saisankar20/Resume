name: Update Resume

on:
  push:
    branches:
      - main
    paths:
      - '*.pdf'

jobs:
  update_resume:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository (full history required for branch switching).
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Configure Git user for commit actions.
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # 3. Detect if an old resume already exists on main.
      - name: Detect old resume
        id: detect_old
        run: |
          if [ -f "resume-SaiSankar.pdf" ]; then
            echo "found_old=true" >> $GITHUB_OUTPUT
          else
            echo "found_old=false" >> $GITHUB_OUTPUT
          fi

      # 4. If an old resume exists, archive it to the old-resume branch with a timestamped name.
      - name: Archive old resume
        if: steps.detect_old.outputs.found_old == 'true'
        run: |
          # Generate a unique timestamp for the archived file.
          VERSION=$(date +'%Y-%m-%d-%H-%M-%S')
          OLD_NAME="resume-SaiSankar-${VERSION}.pdf"
          
          # Switch to (or create) the old-resume branch.
          if git ls-remote --exit-code origin old-resume; then
            git checkout old-resume
          else
            git checkout -b old-resume
          fi
          
          # Pull the current resume from main.
          git checkout main -- resume-SaiSankar.pdf
          
          # Rename the pulled file.
          mv resume-SaiSankar.pdf "$OLD_NAME"
          
          # Ensure only the versioned file is staged.
          git rm --cached resume-SaiSankar.pdf 2>/dev/null || true
          git add "$OLD_NAME"
          git commit -m "Archive old resume as $OLD_NAME"
          git push origin old-resume
          
          # Return to main: pull latest changes, remove the old resume, and push.
          git checkout main
          git pull --rebase origin main
          git rm resume-SaiSankar.pdf
          git commit -m "Remove old resume from main (archived)"
          git push origin main

      # 5. Detect any new PDF file that is not named resume-SaiSankar.pdf.
      - name: Detect new resume file
        id: detect_new
        run: |
          NEWFILE=$(ls *.pdf 2>/dev/null | grep -v "resume-SaiSankar.pdf" || true)
          echo "NEWFILE=$NEWFILE" >> $GITHUB_OUTPUT

      # 6. Rename the new resume to resume-SaiSankar.pdf on main.
      - name: Rename new resume
        if: steps.detect_new.outputs.NEWFILE != ''
        run: |
          # Switch to main and update with the latest remote changes.
          git checkout main
          git pull --rebase origin main
          
          NEWFILE="${{ steps.detect_new.outputs.NEWFILE }}"
          echo "Renaming $NEWFILE to resume-SaiSankar.pdf"
          mv "$NEWFILE" resume-SaiSankar.pdf
          git add resume-SaiSankar.pdf
          git commit -m "Rename new resume to resume-SaiSankar.pdf"
          git push origin main
