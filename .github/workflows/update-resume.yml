name: Update Resume

on:
  push:
    branches:
      - main
    # Only run if at least one PDF changed
    paths:
      - '*.pdf'

jobs:
  update_resume:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repo with full history so we can switch branches.
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Set up Git user so we can commit and push.
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Step 3: Check if an old resume (resume-SaiSankar.pdf) already exists on main.
      - name: Detect old resume
  id: detect_old
  run: |
    if [ -f "resume-SaiSankar.pdf" ]; then
      echo "found_old=true" >> $GITHUB_OUTPUT
    else
      echo "found_old=false" >> $GITHUB_OUTPUT
    fi


      # Step 4: If the old resume exists, archive it into old-resume branch.
      - name: Archive old resume
        if: steps.detect_old.outputs.found_old == 'true'
        run: |
          # Generate a unique version string, e.g. 2025-02-16-10-30-59
          VERSION=$(date +'%Y-%m-%d-%H-%M-%S')
          OLD_NAME="resume-SaiSankar-${VERSION}.pdf"

          # Switch to old-resume branch (create it if it doesn't exist)
          if git ls-remote --exit-code origin old-resume; then
            git checkout old-resume
          else
            git checkout -b old-resume
          fi

          # Bring the old resume from main into this branch
          git checkout main -- resume-SaiSankar.pdf

          # Rename and commit
          mv resume-SaiSankar.pdf "$OLD_NAME"
          git add "$OLD_NAME"
          git commit -m "Archive old resume as $OLD_NAME"
          git push origin old-resume

          # Switch back to main, remove the old resume file
          git checkout main
          git rm resume-SaiSankar.pdf
          git commit -m "Remove old resume from main (archived)"
          git push origin main

      # Step 5: Find any "new" PDF file that is not named resume-SaiSankar.pdf.
      - name: Detect new resume file
        id: detect_new
        run: |
          # List PDF files that do NOT match our main resume filename
          NEWFILE=$(ls *.pdf 2>/dev/null | grep -v "resume-SaiSankar.pdf" || true)
          echo "NEWFILE=$NEWFILE" >> $GITHUB_OUTPUT

      # Step 6: Rename the new file to resume-SaiSankar.pdf on main (if a new file exists).
      - name: Rename new resume
        if: steps.detect_new.outputs.NEWFILE != ''
        run: |
          NEWFILE="${{ steps.detect_new.outputs.NEWFILE }}"
          echo "Renaming $NEWFILE to resume-SaiSankar.pdf"
          mv "$NEWFILE" resume-SaiSankar.pdf
          git add resume-SaiSankar.pdf
          git commit -m "Rename new resume to resume-SaiSankar.pdf"
          git push origin main
